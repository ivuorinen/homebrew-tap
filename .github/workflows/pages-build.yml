---
name: Build and Deploy Documentation
on:
  push:
    branches: [main]
    # Explicit on purpose: only files the site build actually reads. Do not widen
    # back to "scripts/**" (sync/serve/test scripts never touch the site) or add
    # "docs/**" (gitignored build output plus plan docs). Adding Gemfile.lock or
    # the workflow file makes every Renovate bump republish for nothing.
    # No brace expansion here — GitHub path filters do not support "{a,b}".
    paths:
      - "Formula/**"
      - "theme/**"
      - "scripts/build_site.rb"
      - "scripts/parse_formulas.rb"
      - "scripts/asset_processor.rb"
      - "scripts/time_formatter.rb"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # This job runs third-party gem code (mise run setup/build), so it gets only
    # what its own steps use. Publishing rights stay on the deploy job.
    permissions:
      contents: read
      pages: read # actions/configure-pages reads the Pages site config

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tools in mise.toml. No cache: this job's output is published, so it
      # restores nothing an earlier run saved.
      - name: Set up mise
        uses: ./.github/actions/setup-mise
        with:
          cache: "false"

      # parse_formulas.rb logs the formula count, so no separate jq step.
      - name: Setup project dependencies and build site
        shell: bash
        run: |
          mise run setup
          mise run build

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      pages: write # required by actions/deploy-pages to publish the Pages deployment
      id-token: write # required by actions/deploy-pages for OIDC authentication

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
