---
name: Build and Deploy Documentation
on:
  push:
    branches: [main]
    # Explicit on purpose: only files the site build actually reads. Do not widen
    # back to "scripts/**" (sync/serve/test scripts never touch the site) or add
    # "docs/**" (gitignored build output plus plan docs). Adding Gemfile.lock or
    # the workflow file makes every Renovate bump republish for nothing.
    # No brace expansion here — GitHub path filters do not support "{a,b}".
    paths:
      - "Formula/**"
      - "theme/**"
      - "scripts/build_site.rb"
      - "scripts/parse_formulas.rb"
      - "scripts/asset_processor.rb"
      - "scripts/array_extensions.rb"
      - "scripts/string_extensions.rb"
      - "scripts/time_formatter.rb"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # required by actions/deploy-pages to publish the Pages deployment
      id-token: write # required by actions/deploy-pages for OIDC authentication

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0

      - name: Setup project dependencies and build site
        shell: bash
        run: |
          make setup
          make build
          echo "Generated formulae.json with $(jq '.formulae | length' docs/_data/formulae.json) formulae"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      pages: write # required by actions/deploy-pages to publish the Pages deployment
      id-token: write # required by actions/deploy-pages for OIDC authentication

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
