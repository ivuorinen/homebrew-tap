---
name: Sync formulae from releases
on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-formulae
  cancel-in-progress: false

jobs:
  sync:
    name: Sync formulae
    runs-on: ubuntu-24.04
    permissions:
      contents: write # commits and force-pushes the sync/formulae branch
      pull-requests: write # opens/updates the automated sync PR via gh pr create

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Generation happens *inside* this action, between test-bot's cleanup and
      # its syntax check. It cannot happen in an earlier step of this job:
      # `Homebrew/actions/setup-homebrew` symlinks the tap into
      # $GITHUB_WORKSPACE and re-clones it at origin/main, which discards both
      # the generated formulae and any branch committed before it. That is what
      # made this job fail with "src refspec sync/formulae does not match any"
      # while test-bot silently validated main's formulae instead of the new
      # ones. If this fails the job fails and no PR is opened.
      # Ruby and bundler come from the action; no separate setup-ruby needed.
      - name: Generate and validate formulae
        uses: ./.github/actions/ci
        with:
          sync-formulae: "true"
          gh-token: ${{ github.token }}

      - name: Detect changes
        id: diff
        run: |
          # Stage first so brand-new (untracked) formulae count as changes too.
          git add -A Formula
          if git diff --cached --quiet -- Formula; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formula changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat -- Formula
          fi

      - name: Commit to sync branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -B keeps the already-staged changes on the new branch.
          git checkout -B sync/formulae
          git commit -m "chore(formulae): sync from upstream releases"

      - name: Push branch and open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkout runs with persist-credentials: false, so wire up git auth
          # narrowly here, just before the one step in this job that pushes.
          gh auth setup-git
          # sync/formulae is a disposable bot-owned branch; force is intentional.
          git push --force origin sync/formulae
          if ! gh pr view sync/formulae >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head sync/formulae \
              --title "chore(formulae): sync from upstream releases" \
              --body "Automated update of formulae from all GitHub releases (one keg_only \`@version\` formula per release, plus the unversioned latest) of the repos in \`formula-sources.json\`. Validated in-job by \`brew test-bot\`."
          fi
