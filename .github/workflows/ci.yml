---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-bot:
    name: Test bot
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      pull-requests: write # brew test-bot posts style/audit annotations as PR review comments
      actions: read # brew test-bot queries the Actions API for run/job context

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tap
        uses: ./.github/actions/ci

  # No path filter: a dependency bump (e.g. json 3) can break the site build
  # without touching any file pages-build.yml watches, and only fails at deploy.
  site:
    name: Build site and run tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          bundler-cache: true

      - name: Run tests
        run: make test

      - name: Build site
        run: make build
